plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_archives_name
}

loom {
    runs {
        // Same working directory layout as in the Forge projects
        configureEach {
            runDir 'run'
        }
    }
}

dependencies {
    // Minecraft 26.1+ is no longer obfuscated: no mappings, the code uses Mojang's names directly
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    var replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
            mod_authors: mod_authors, mod_contact_email: mod_contact_email, mod_description: mod_description,
            minecraft_version_range: minecraft_version_range, loader_version_min: loader_version_min, fabric_version_min: fabric_version_min,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Minecraft 26.1 requires Java 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
