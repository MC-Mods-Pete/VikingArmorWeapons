# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
# Minecraft 26.1+ is no longer obfuscated: no mappings (Parchment) needed
minecraft_version=26.2
# all 26.2.x
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.93
# Range for neoforge.mods.toml (oldest NeoForge for Minecraft 26.2)
neo_version_range=[26.2.0.0-beta,)

## Mod Properties
mod_id=vikingarmorweapons
# Name for the jar file
mod_archives_name=VikingArmorWeapons
mod_name=Viking Armor and Weapons
mod_license=All Rights Reserved
mod_version=1.1.0-NeoForge-mc26.2
mod_group_id=net.petemc.vikingarmorweapons
mod_authors=Pete MC Mods (mcmods.pete@gmail.com)
mod_description=This mod adds Viking Armor and Weapons to Minecraft.
