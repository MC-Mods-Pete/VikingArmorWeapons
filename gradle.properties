# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

## Environment Properties
# https://fabricmc.net/develop
minecraft_version=26.3
# Range for fabric.mod.json: all 26.3.x versions
minecraft_version_range=>=26.3
loader_version=0.20.1
# Minimum Fabric Loader required at runtime (fabric.mod.json), same minimum as the Fabric API for 26.3
loader_version_min=0.19.3
loom_version=1.19.3
fabric_version=0.165.2+26.3
# Minimum Fabric API required at runtime (fabric.mod.json): first build published after the 26.3 release (2026-09-15), tested.
# Older 26.3 builds come from the snapshot phase and crash on the release (Fabric API's own mixins fail).
fabric_version_min=0.160.6

## Mod Properties
mod_id=vikingarmorweapons
# Name for the jar file
mod_archives_name=VikingArmorWeapons
mod_name=Viking Armor and Weapons
mod_license=All-Rights-Reserved
mod_version=1.1.0-Fabric-mc26.3
mod_group_id=net.petemc.vikingarmorweapons
mod_authors=Pete MC Mods
mod_contact_email=mcmods.pete@gmail.com
mod_description=This mod adds Viking Armor and Weapons to Minecraft.
